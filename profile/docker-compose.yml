services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${ORDERBOOK_DB_PASSWORD:?Set ORDERBOOK_DB_PASSWORD}
      POSTGRES_USER: orderbook
      POSTGRES_DB: orderbook
    # Database access stays on the private Compose network.
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: orderbook
      PGDATABASE: orderbook
      PGPASSWORD: ${ORDERBOOK_DB_PASSWORD:?Set ORDERBOOK_DB_PASSWORD}
volumes:
  db_data:
